name: Build House Capture IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned .app
        working-directory: apps/house-capture
        run: |
          PROJECT_FILE=$(find . -maxdepth 1 -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          echo "Building using: $PROJECT_FILE"
          
          xcodebuild clean build \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            BUILD_DIR="${{ github.workspace }}/build"

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ${{ github.workspace }}/build -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r house-capture.ipa Payload
          mkdir -p output
          mv house-capture.ipa output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: house-capture-ipa
          path: output/house-capture.ipa
