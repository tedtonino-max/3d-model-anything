name: Build House Capture IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: apps/house-capture
        run: |
          echo "Xcode project genereren vanuit project.yml..."
          xcodegen generate
          ls -la

      - name: Build unsigned .app
        working-directory: apps/house-capture
        run: |
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          echo "Gevonden project: $PROJECT"
          SCHEME=$(xcodebuild -project "$PROJECT" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | head -n 1 | xargs)
          echo "Gebruikt scheme: $SCHEME"

          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ github.workspace }}/build"

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "${{ github.workspace }}/build" -name "*.app" | head -n 1)
          echo "Gevonden app: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r house-capture.ipa Payload
          mkdir -p output
          mv house-capture.ipa output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: house-capture-ipa
          path: output/house-capture.ipa
