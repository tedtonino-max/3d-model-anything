name: Build House Capture IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Inspect directory structure
        run: |
          echo "=== Inhoud van apps/house-capture ==="
          ls -la apps/house-capture
          echo "=== Zoeken naar Xcode projecten in de repo ==="
          find . -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift"

      - name: Build unsigned .app
        run: |
          # Zoek recursief naar .xcworkspace of .xcodeproj in apps/house-capture
          TARGET_DIR="apps/house-capture"
          WORKSPACE=$(find "$TARGET_DIR" -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find "$TARGET_DIR" -name "*.xcodeproj" | head -n 1)
          
          if [ -n "$WORKSPACE" ]; then
            echo "Gevonden workspace: $WORKSPACE"
            xcodebuild clean build \
              -workspace "$WORKSPACE" \
              -scheme $(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | head -n 1 | xargs) \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              BUILD_DIR="${{ github.workspace }}/build"
          elif [ -n "$PROJECT" ]; then
            echo "Gevonden project: $PROJECT"
            xcodebuild clean build \
              -project "$PROJECT" \
              -scheme $(xcodebuild -project "$PROJECT" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | head -n 1 | xargs) \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              BUILD_DIR="${{ github.workspace }}/build"
          else
            echo "Geen Xcode project gevonden. Controleer de 'Inspect directory structure' stap hierboven."
            exit 1
          fi

      - name: Package to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "${{ github.workspace }}/build" -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Geen .app bestand gevonden in build directory!"
            exit 1
          fi
          echo "Inpakken van $APP_PATH naar IPA..."
          cp -r "$APP_PATH" Payload/
          zip -r house-capture.ipa Payload
          mkdir -p output
          mv house-capture.ipa output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: house-capture-ipa
          path: output/house-capture.ipa
